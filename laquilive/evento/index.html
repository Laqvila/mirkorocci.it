<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>L'AquiLive — Apri l'evento</title>
  <!-- PAGINA-PONTE dei link condivisi dall'app L'AquiLive:
         mirkorocci.it/laquilive/evento/?id=<uuid>
       Chi ha l'app: si apre da sola sulla scheda dell'evento (schema aqlive99://).
       Chi non ce l'ha: Android va su Google Play da solo, iPhone trova il tasto
       dell'App Store. Da computer si vedono l'evento e i due store.
       noindex: è un passaggio, non un contenuto da indicizzare. -->
  <meta name="robots" content="noindex">
  <meta name="description" content="Apri questo evento su L'AquiLive, l'app gratuita con tutti gli eventi dell'Aquila e dintorni.">
  <meta property="og:title" content="Un evento su L'AquiLive">
  <meta property="og:description" content="Tocca per aprirlo nell'app. Non ce l'hai? È gratuita, per Android e iPhone.">
  <meta property="og:image" content="https://mirkorocci.it/assets/press/laquilive-icona.png">
  <meta property="og:type" content="website">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #0B0908; color: #EDE8DE; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 440px; padding: 28px 22px 40px; text-align: center; }
    .marchio { font-size: .78rem; letter-spacing: .22em; text-transform: uppercase; color: #F2C230; font-weight: 800; }
    .scheda { margin: 18px 0 22px; border: 1px solid rgba(228,190,160,.16); border-radius: 22px; overflow: hidden;
              background: #15110E; text-align: left; }
    .scheda img { display: block; width: 100%; max-height: 260px; object-fit: cover; background: #1D1814; }
    .scheda .testo { padding: 16px 18px 18px; }
    h1 { margin: 0 0 8px; font-size: 1.3rem; line-height: 1.25; }
    .riga { margin: 4px 0; color: #B9AD9C; font-size: .98rem; line-height: 1.45; }
    .tasto { display: block; margin: 12px 0 0; padding: 15px 18px; border-radius: 999px; font-weight: 800;
             font-size: 1.02rem; text-decoration: none; }
    .primo { background: linear-gradient(135deg, #F5820C, #E11D5F); color: #fff; }
    .store { background: #1D1814; color: #EDE8DE; border: 1px solid rgba(228,190,160,.22); }
    .nota { margin-top: 20px; color: #7A6C5D; font-size: .86rem; line-height: 1.5; }
    .nascosto { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="marchio">L'AquiLive</div>
    <div class="scheda">
      <img id="foto" class="nascosto" alt="">
      <div class="testo">
        <h1 id="titolo">Un evento su L'AquiLive</h1>
        <p class="riga" id="quando"></p>
        <p class="riga" id="dove"></p>
      </div>
    </div>
    <a class="tasto primo" id="apri" href="#">Apri nell'app</a>
    <p class="nota" id="senza">Non hai l'app? È gratuita.</p>
    <a class="tasto store" id="play" href="https://play.google.com/store/apps/details?id=it.aqlive99.app">Scarica per Android (Google Play)</a>
    <a class="tasto store" id="apple" href="https://apps.apple.com/it/app/laquilive/id6796280318">Scarica per iPhone (App Store)</a>
    <p class="nota">Tutti gli eventi, i servizi e i segreti dell'Aquila e dintorni in un'app gratuita.</p>
  </main>
  <script>
    (function () {
      var PLAY = 'https://play.google.com/store/apps/details?id=it.aqlive99.app';
      var SB = 'https://kdgytiribodwqccvwzvc.supabase.co';
      // chiave PUBBLICA (la stessa dentro l'app): legge solo ciò che le regole del database espongono a tutti
      var CHIAVE = 'sb_publishable_-tudt_coGbSiMfFxTWZ9yQ_YYxUtBid';

      var id = (new URLSearchParams(location.search).get('id') || '').trim();
      var valido = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id);
      var ua = navigator.userAgent || '';
      var android = /Android/i.test(ua);
      var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var apri = document.getElementById('apri');

      // il tocco si conta nello Studio come «condivisione»: niente IP, niente identificativi
      try {
        fetch(SB + '/rest/v1/rpc/registra_click_link', {
          method: 'POST', keepalive: true,
          headers: { 'Content-Type': 'application/json', apikey: CHIAVE, Authorization: 'Bearer ' + CHIAVE },
          body: JSON.stringify({ p_canale: 'condivisione', p_destinazione: 'evento', p_piattaforma: ios ? 'ios' : android ? 'android' : 'altro' })
        }).catch(function () {});
      } catch (e) { /* il conteggio non deve mai fermare l'apertura */ }

      // senza un id valido resta la pagina degli store, senza il tasto «Apri»
      if (!valido) { apri.className += ' nascosto'; return; }

      var schema = 'aqlive99://evento/' + id;
      // su Android l'intent fa tutto da solo: apre l'app se c'è, altrimenti Google Play
      var intent = 'intent://evento/' + id + '#Intent;scheme=aqlive99;package=it.aqlive99.app;' +
                   'S.browser_fallback_url=' + encodeURIComponent(PLAY) + ';end';
      apri.href = android ? intent : schema;

      if (android) {
        document.getElementById('apple').className += ' nascosto';
        location.href = intent;
      } else if (ios) {
        document.getElementById('play').className += ' nascosto';
        // se l'app c'è iOS chiede «Aprire in L'AquiLive?»; se non c'è resta questa pagina col tasto dell'App Store
        setTimeout(function () { location.href = schema; }, 250);
      } else {
        // da computer non c'è niente da aprire: si mostrano l'evento e i due store
        apri.className += ' nascosto';
        document.getElementById('senza').textContent = "L'app è gratuita, per Android e iPhone.";
      }

      // l'anteprima dell'evento: titolo, quando e dove
      fetch(SB + '/rest/v1/event_canonical?select=title,start_at,venue_name,comune,image_url&id=eq.' + id + '&limit=1',
            { headers: { apikey: CHIAVE, Authorization: 'Bearer ' + CHIAVE } })
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (righe) {
          var e = righe && righe[0];
          if (!e) return;
          document.getElementById('titolo').textContent = e.title || "Un evento su L'AquiLive";
          document.title = (e.title ? e.title + ' — ' : '') + "L'AquiLive";
          if (e.start_at) {
            var d = new Date(e.start_at);
            document.getElementById('quando').textContent = '📅 ' + d.toLocaleDateString('it-IT',
              { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'Europe/Rome' }) + ', ' +
              d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Rome' });
          }
          var dove = [e.venue_name, e.comune].filter(function (x, i, a) { return x && a.indexOf(x) === i; }).join(', ');
          if (dove) document.getElementById('dove').textContent = '📍 ' + dove;
          if (e.image_url && /^https:\/\//i.test(e.image_url)) {
            var foto = document.getElementById('foto');
            foto.onload = function () { foto.className = ''; };
            foto.src = e.image_url;
          }
        })
        .catch(function () { /* la pagina funziona anche senza anteprima */ });
    })();
  </script>
</body>
</html>
